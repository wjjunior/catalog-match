name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test --coverage

      - run: pnpm build

      # Status correctness and constraint preservation on the golden set may not fall
      # below the floor, and the set may not shrink. docs/DESIGN.md 10.3. The floor is
      # read from main rather than from this branch: a change that regresses must not be
      # able to lower the bar it is measured against in the same commit. The fallback
      # covers only the commit that first adds the file.
      - name: eval gate
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:data/eval/baseline.json > "$RUNNER_TEMP/floor.json" \
            || cp data/eval/baseline.json "$RUNNER_TEMP/floor.json"
          pnpm run eval --gate --floor "$RUNNER_TEMP/floor.json"
